services:
  auth-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: authservice-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}"
    ports:
      - "${SQLSERVER_PORT:-14333}:1433"
    volumes:
      - authservice-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  auth-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: authservice-api:local
    container_name: authservice-api
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__AuthService: "Server=auth-db,1433;Database=AuthService;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env};TrustServerCertificate=True;Encrypt=False"
      Database__AplicarMigrationsAoIniciar: "true"
      Jwt__Emissao: AuthService
      Jwt__Audiencia: AuthService.Clientes
      Jwt__ChaveSecreta: "${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}"
      LinksSistema__UrlBaseApi: "${AUTH_PUBLIC_URL:-http://localhost:7295}"
      Outbox__Habilitado: "${OUTBOX_HABILITADO:-false}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__EnableSsl: "${SMTP_ENABLE_SSL:-true}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromEmail: "${SMTP_FROM_EMAIL:-nao-responda@auth.com.br}"
      Smtp__FromName: "${SMTP_FROM_NAME:-Authenticatica}"
    ports:
      - "${AUTH_API_PORT:-7295}:8080"
    restart: unless-stopped

volumes:
  authservice-sqlserver-data:
